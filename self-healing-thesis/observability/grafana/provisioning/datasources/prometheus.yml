apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: "3.11.3"
      # Align scrape interval with prometheus.yml global.scrape_interval
      timeInterval: "15s"
    editable: false
