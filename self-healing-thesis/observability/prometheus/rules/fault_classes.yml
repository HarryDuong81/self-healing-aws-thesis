# The file actually deployed to the monitoring host is
#     ansible/roles/monitoring_stack/files/fault_classes.yml
# whose own header explains why the deploy source moved here: the previous
# `{{ playbook_dir }}/../../observability/...` path this role used assumed
# `ansible/` and `observability/` are sibling directories on the Ansible
# controller, which is true for a full repo checkout but false for the
# orchestrator's own scoped host sync (/opt/orchestrator, AD-010) -- so
# `deploy.yml --tags monitoring` run from there (exactly what §15.3's own
# operational rule tells an operator to do) always failed at this task.
# This copy is kept only so `docker compose -f observability/docker-
# compose.yml config -q` (CI lint, §4.1) has something to validate against
# and so a local/dev reader sees the alert rules alongside the plain
# docker-compose.yml. Keep the two in step by hand -- nothing currently
# syncs them automatically (same caveat as observability/docker-
# compose.yml's own header for the docker-compose.yml/.j2 split).
