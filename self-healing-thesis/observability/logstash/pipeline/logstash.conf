# logstash.conf — ELK log pipeline for self-healing thesis
# Ingests Filebeat output from EC2 instances, enriches with fault signatures,
# and routes structured documents to Elasticsearch for indexing.

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # ── Parse syslog / journald messages ────────────────────────────────────────
  if [fields][log_type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_host} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      tag_on_failure => ["_grokparsefailure_syslog"]
    }

    # disk_saturation: kernel "No space left on device" signature
    if [syslog_message] =~ /No space left on device/ {
      mutate {
        add_field => { "fault_type" => "disk_saturation" }
        add_tag   => ["fault_detected"]
      }
    }
  }

  # ── Parse nginx access logs ──────────────────────────────────────────────────
  if [fields][log_type] == "nginx_access" {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:timestamp}\] "%{WORD:method} %{DATA:uri} HTTP/%{NUMBER:http_version}" %{NUMBER:response_code:int} %{NUMBER:bytes:int}'
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    # service_crash: HTTP 503 responses from nginx
    if [response_code] == 503 {
      mutate {
        add_field => { "fault_type" => "service_crash" }
        add_tag   => ["fault_detected"]
      }
    }
  }

  # ── Parse systemd unit journal logs ─────────────────────────────────────────
  if [fields][log_type] == "systemd" {
    # service_crash: unit failed / stopped unexpectedly
    if [message] =~ /Failed to start|Stopped unexpectedly|Main process exited/ {
      mutate {
        add_field => { "fault_type" => "service_crash" }
        add_tag   => ["fault_detected"]
      }
    }
  }

  # ── Enrich all events with EC2 instance metadata ─────────────────────────────
  mutate {
    add_field => {
      "project"     => "self-healing-thesis"
      "environment" => "experiment"
    }
  }

  # ── Timestamp normalisation ──────────────────────────────────────────────────
  date {
    match    => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    target   => "@timestamp"
    timezone => "UTC"
  }
}

output {
  # Primary index for all experiment events.
  # xpack.security.enabled=false in the Docker Compose — no credentials required.
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "self-healing-%{+YYYY.MM.dd}"
  }

  # Separate index for detected fault events (used by Kibana fault dashboards
  # and cross-referenced with orchestrator run_id for MTTR correlation).
  if "fault_detected" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "self-healing-faults-%{+YYYY.MM.dd}"
    }
  }

  # Stdout debug output — comment out for production experiment runs
  # stdout { codec => rubydebug }
}
