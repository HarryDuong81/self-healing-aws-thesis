# =============================================================================
# SUPERSEDED — not applied by any playbook.
#
# Filebeat and the OTel agent are installed by roles/filebeat and
# roles/otel_collector (9.x repo, signed-by keyring); the detection-path
# components come from the compute module's user_data at first boot.
#
# This role installs Filebeat from the Elastic 8.x repository using the
# deprecated apt_key module and would downgrade a 9.4.1 agent if run.
# Retained as reference only.
# =============================================================================
---
# roles/target_node/tasks/main.yml
# Configures target instances via SSM (community.aws.aws_ssm connection)
# No inbound SSH required — all tasks run through SSM RunCommand

- name: Update apt cache on target
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install target packages
  apt:
    name:
      - nginx
      - iproute2
      - iptables
      - stress-ng
      - curl
      - jq
    state: present

# ── NGINX ─────────────────────────────────────────────────────────────────────
- name: Remove default NGINX site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Create nginx-json log directory
  file:
    path: /var/log/nginx-json
    state: directory
    owner: www-data
    group: adm
    mode: "0755"

- name: Deploy NGINX config from template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c %s
  notify: reload nginx

- name: Enable and start NGINX
  systemd:
    name: nginx
    enabled: yes
    state: started

# ── Node Exporter ─────────────────────────────────────────────────────────────
- name: Check if node_exporter is already installed at correct version
  command: /usr/local/bin/node_exporter --version
  register: ne_version_check
  failed_when: false
  changed_when: false

- name: Download and install node_exporter v{{ node_exporter_version }}
  when: node_exporter_version not in (ne_version_check.stdout | default(''))
  block:
    - name: Create node_exporter system user
      user:
        name: node_exporter
        system: yes
        shell: /bin/false
        create_home: no

    - name: Download node_exporter tarball
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"

    - name: Extract node_exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: yes

    - name: Create textfile collector directory
      file:
        path: /var/lib/node_exporter/textfile
        state: directory
        owner: node_exporter
        group: node_exporter
        mode: "0755"

    - name: Deploy node_exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          Type=simple
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter \
              --web.listen-address=:{{ node_exporter_port }} \
              --collector.systemd \
              --collector.processes \
              --collector.textfile.directory=/var/lib/node_exporter/textfile
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    - name: Cleanup node_exporter archive
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/node_exporter.tar.gz
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    enabled: yes
    state: started
    daemon_reload: yes

# ── Filebeat ──────────────────────────────────────────────────────────────────
- name: Add Elastic apt GPG key
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Add Elastic apt repository
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: Install Filebeat
  apt:
    name: "filebeat={{ filebeat_version }}"
    state: present
    update_cache: yes

- name: Deploy Filebeat configuration
  template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: "0600"
  notify: restart filebeat

- name: Enable and start Filebeat
  systemd:
    name: filebeat
    enabled: yes
    state: started
