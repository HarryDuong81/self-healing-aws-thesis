---
# roles/self_healing/tasks/main.yml
# Installs and configures the Flask orchestrator as a systemd service.
#
# Runtime paths on the monitoring server after this role runs:
#   Orchestrator Python  →  {{ orchestrator_src }}/
#   Terraform targets/   →  {{ orchestrator_base_dir }}/terraform/targets/
#   Ansible playbooks    →  {{ orchestrator_base_dir }}/ansible/playbooks/
#   Dynamic inventory    →  {{ orchestrator_base_dir }}/ansible/inventory/
#   Results JSONL        →  {{ orchestrator_results }}/mttr_log.jsonl
#
# Execute-layer env vars (must match orchestrator/execute.py):
#   ANSIBLE_PLAYBOOK_DIR → {{ orchestrator_base_dir }}/ansible/playbooks
#   ANSIBLE_INVENTORY    → {{ orchestrator_base_dir }}/ansible/inventory/aws_ec2.yml
#   ANSIBLE_CFG          → {{ orchestrator_base_dir }}/ansible/ansible.cfg
#   TERRAFORM_TARGETS_DIR→ {{ orchestrator_base_dir }}/terraform/targets
# ──────────────────────────────────────────────────────────────────────────────

# ── Python (native AMI interpreter, 3.14.4 — see the architecture documentation Table 4.2) ──────────
# Previously installed Python 3.11 via the deadsnakes PPA, which predates the
# thesis's Round-21 correction to 3.12.3 and was never updated to match. Live
# testing found neither is available on this AMI without deadsnakes (whose
# keyserver fetch failed: "Unable to get required signing key" against
# hkp://keyserver.ubuntu.com), and python3.12 isn't in apt at all on this
# release. The AMI ships Python 3.14.4 natively; use it directly rather than
# depend on an external PPA/keyserver for the orchestrator venv.
- name: Install build-essential
  apt:
    name:
      - build-essential
    state: present
    update_cache: yes

# session-manager-plugin is required for the orchestrator's own runtime
# Ansible invocations (execute.py calls `ansible-playbook ... --connection
# community.aws.aws_ssm` against targets), separate from the control node's
# copy of this same binary. Confirmed live: the first real end-to-end
# fault-injection test worked all the way through detection → Alertmanager
# → orchestrator webhook → MAPE-K classification → dispatch, then failed at
# the very last step with "Failed to find required executable
# session-manager-plugin" because this was never installed on the
# monitoring host itself — only on the operator's control node earlier in
# this session.
- name: Download session-manager-plugin
  get_url:
    url: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
    dest: /tmp/session-manager-plugin.deb
    mode: "0644"

- name: Install session-manager-plugin
  apt:
    deb: /tmp/session-manager-plugin.deb

# ── Directory structure ───────────────────────────────────────────────────────
- name: Create orchestrator directory tree
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ orchestrator_base_dir }}"
    - "{{ orchestrator_src }}"
    - "{{ orchestrator_results }}"
    - "{{ orchestrator_logs }}"
    - /etc/orchestrator

# ── Deploy target SSH private key ─────────────────────────────────────────────
# Deliberate reversal of the no-SSH-on-targets invariant 
# to work around a confirmed AWS Session Manager plugin defect — see
# ansible/inventory/group_vars/target_nodes/vars.yml for the full rationale.
# Generated by terraform/bootstrap/main.tf (tls_private_key.target_ssh),
# written locally to terraform/bootstrap/target_ssh_key.pem by the
# local_sensitive_file resource; synced here to the path referenced by
# ansible_ssh_private_key_file in group_vars/target_nodes/vars.yml.
- name: Create .ssh directory for target SSH key
  file:
    path: "{{ orchestrator_base_dir }}/.ssh"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

# Primary source: SSM Parameter Store (SecureString), provisioned by
# terraform/bootstrap/main.tf (aws_ssm_parameter.target_ssh_private_key) and
# readable through the monitoring host's own instance role. This is what the
# CD path relies on: the GitHub runner never handles the private key, and no
# deployment artefact carries it.
#
# The AWS CLI is used rather than a lookup plugin so this does not depend on
# which amazon.aws / community.aws lookup name is available in the collection
# version installed on the control node.
- name: Fetch target SSH private key from SSM Parameter Store
  command: >-
    aws ssm get-parameter
    --name /{{ project }}/{{ deploy_environment }}/target-ssh-private-key
    --with-decryption
    --region {{ aws_region }}
    --query Parameter.Value
    --output text
  register: target_ssh_key_ssm
  changed_when: false
  failed_when: false
  no_log: true

# Classify the failure before deciding anything. `failed_when: false` above
# suppresses the task failure so the outcome can be inspected, but that must
# not become failure masking: only ONE non-zero outcome justifies falling back
# to the local PEM, and that is the parameter genuinely not existing yet.
#
# In particular a missing kms:Decrypt grant surfaces here. With
# WithDecryption=true, Parameter Store calls KMS on the instance role's behalf
# and the request fails with AccessDeniedException — it does NOT return
# ciphertext. Left unclassified, that non-zero exit would route to the local
# fallback, which on the monitoring host does not exist (deploy.yml excludes
# *.pem from the bundle), reporting an IAM problem as "file not found".
- name: Assert the SSM fetch failed only because the parameter does not exist yet
  assert:
    that:
      - target_ssh_key_ssm.rc == 0 or
        'ParameterNotFound' in (target_ssh_key_ssm.stderr | default(''))
    fail_msg: >-
      SSM GetParameter failed for
      /{{ project }}/{{ deploy_environment }}/target-ssh-private-key with something
      other than ParameterNotFound. The most likely cause is a missing
      kms:Decrypt grant on the instance role — see terraform/modules/iam/main.tf,
      Sid KMSDecryptSSMParameters. Remove `no_log: true` from the fetch task
      above to see the AWS error verbatim.
    quiet: true

# A readable parameter that does not hold a private key is a configuration
# error, not a reason to fall back: the local PEM may be a different key from
# the one the parameter is supposed to carry, and deploying it would leave the
# two silently diverged. Fail instead.
- name: Assert the SSM parameter holds a PEM private key
  assert:
    that:
      - target_ssh_key_ssm.rc != 0 or
        target_ssh_key_ssm.stdout is search('BEGIN .*PRIVATE KEY')
    fail_msg: >-
      /{{ project }}/{{ deploy_environment }}/target-ssh-private-key was read
      successfully but does not contain a PEM private key. Check the parameter
      value and type (it must be SecureString, written by
      aws_ssm_parameter.target_ssh_private_key).
    quiet: true

- name: Deploy target SSH private key from SSM Parameter Store
  copy:
    content: "{{ target_ssh_key_ssm.stdout }}\n"
    dest: "{{ orchestrator_base_dir }}/.ssh/target_ssh_key.pem"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  when: target_ssh_key_ssm.rc == 0
  no_log: true

# Fallback: the local PEM written by local_sensitive_file during a workstation
# cold deploy. Retained so the manual path documented in CLAUDE.md §4.2 keeps
# working when the parameter does not exist yet — notably during the very
# first bootstrap apply, before the parameter has been created.
#
# role_path, not playbook_dir: role_path is always
# <repo>/ansible/roles/self_healing, so ../../../ reaches the repository root
# whichever playbook imports this role. playbook_dir would resolve correctly
# from playbooks/deploy.yml but point above the repository root from
# bootstrap.yml.
- name: Deploy target SSH private key from local Terraform output
  copy:
    src: "{{ role_path }}/../../../terraform/bootstrap/target_ssh_key.pem"
    dest: "{{ orchestrator_base_dir }}/.ssh/target_ssh_key.pem"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  when: target_ssh_key_ssm.rc != 0

# ── Sync orchestrator Python source ──────────────────────────────────────────
# `synchronize` requires rsync over SSH/Docker/local filesystem and does not
# work over the community.aws.aws_ssm connection plugin used by
# monitoring_host (confirmed live in bootstrap.yml). `copy` is
# connection-agnostic. It has no exclude filter, but the orchestrator/
# source tree does not carry __pycache__/.git artifacts in a clean checkout.
# gunicorn imports app.py, execute.py, plan.py and routing.yaml once at start-up,
# so copying new source over a running service changes nothing until it is
# restarted. Without this notify a code-only deploy left the old code running
# (confirmed live: the 2026-10-03 execute.py fix sat on disk, unloaded, until a
# manual restart on 2026-10-05). The handler runs once, at the end of the play.
- name: Sync orchestrator source files
  copy:
    src: "{{ playbook_dir }}/../../orchestrator/"
    dest: "{{ orchestrator_src }}/"
    mode: preserve
  notify: restart orchestrator

# ── Sync experiment harness (run_campaign.py, run_one.py, inject_once.py,
#    correlation/) ────────────────────────────────────────────────────────────
# Was missing entirely — only orchestrator/ was deployed to {{ orchestrator_src }},
# so run_campaign.py had no deployed copy anywhere on this host at all.
# Confirmed live: `python experiments/trials/run_campaign.py` from
# {{ orchestrator_base_dir }} failed with "No such file or directory".
#
# Deployed one level under {{ orchestrator_base_dir }} (not under
# {{ orchestrator_src }}) so experiments/trials/run_one.py and
# experiments/correlation/correlate.py resolve their _REPO_ROOT
# (parent.parent.parent of the file) to {{ orchestrator_base_dir }} — the
# same directory mttr_logger.py resolves its own _REPO_ROOT
# (parent.parent of src/mttr_logger.py) to. Both processes must agree on
# this path for experiments/correlation/correlate.py's local-file
# trial-correlation handoff (Ch4 §4.6.1) to work: the harness process
# (run_one.py → inject_once.py → record_injection()) and the orchestrator
# process (mttr_logger.py → find_recent_injection()) must read/write the
# same results/correlation.jsonl.
- name: Create experiment harness directory on monitoring server
  file:
    path: "{{ orchestrator_base_dir }}/experiments"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Archive experiment harness locally (excluding __pycache__)
  archive:
    path: "{{ playbook_dir }}/../../experiments/"
    dest: /tmp/experiments_sync.tar.gz
    format: gz
    exclusion_patterns:
      - "*/__pycache__/*"
      - "*.pyc"
  delegate_to: localhost
  become: no

- name: Copy experiment harness archive to monitoring server
  copy:
    src: /tmp/experiments_sync.tar.gz
    dest: /tmp/experiments_sync.tar.gz
    mode: "0644"

- name: Extract experiment harness archive
  unarchive:
    src: /tmp/experiments_sync.tar.gz
    dest: "{{ orchestrator_base_dir }}/experiments/"
    remote_src: yes

- name: Set ownership of experiment harness files
  file:
    path: "{{ orchestrator_base_dir }}/experiments"
    state: directory
    owner: ubuntu
    group: ubuntu
    recurse: yes

# ── Sync Terraform targets workspace ─────────────────────────────────────────
# Orchestrator runs `terraform apply -auto-approve` in the targets/ workspace.
# No -target flag; scope is enforced by the workspace boundary .
- name: Create Terraform targets directory on monitoring server
  file:
    path: "{{ orchestrator_base_dir }}/terraform/targets"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

# `copy` has no exclude filter, unlike the `synchronize`/rsync task this
# replaces (which explicitly excluded .terraform/, *.tfstate*, and the lock
# file). Confirmed live: a plain directory `copy` of terraform/targets/
# failed with a checksum mismatch, almost certainly a large/actively-written
# local .terraform/ provider cache from earlier local terraform runs on this
# control node — and copying it would fight with the "Run terraform init on
# targets workspace" task immediately below, which expects a clean
# workspace. Archive locally (excluding those paths) and extract remotely
# instead, to preserve the same exclusions `synchronize` provided.
#
# unarchive does NOT create its own dest directory (confirmed live: "dest
# ... must be an existing dir") — unlike the targets/ workspace above, this
# one has no earlier "Create ... directory" task, so it must be created
# explicitly before the extract step below.
- name: Create Terraform modules directory on monitoring server
  file:
    path: "{{ orchestrator_base_dir }}/terraform/modules"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Archive Terraform modules locally (excluding .terraform state)
  archive:
    path: "{{ playbook_dir }}/../../terraform/modules/"
    dest: /tmp/tf_modules_sync.tar.gz
    format: gz
    exclusion_patterns:
      # "*/.terraform/*" alone only matches a NESTED .terraform/ (one path
      # segment before it); since `path` above IS the terraform root being
      # archived, its own top-level .terraform/ has no leading segment and
      # was silently NOT excluded. Confirmed live: a local `terraform init`
      # run from this workstation left .terraform/terraform.tfstate (the
      # backend-selection cache) in the tar, which then made the monitoring
      # host's own `terraform init -backend-config=...` fail with "Backend
      # configuration changed" against a cache it never created.
      - ".terraform/*"
      - "*/.terraform/*"
      - "*.terraform.lock.hcl"
      - "*.tfstate"
      - "*.tfstate.backup"
  delegate_to: localhost
  become: no

- name: Copy Terraform modules archive to monitoring server
  copy:
    src: /tmp/tf_modules_sync.tar.gz
    dest: /tmp/tf_modules_sync.tar.gz
    mode: "0644"

- name: Extract Terraform modules archive
  unarchive:
    src: /tmp/tf_modules_sync.tar.gz
    dest: "{{ orchestrator_base_dir }}/terraform/modules/"
    remote_src: yes

- name: Archive Terraform targets workspace locally (excluding .terraform state)
  archive:
    path: "{{ playbook_dir }}/../../terraform/targets/"
    dest: /tmp/tf_targets_sync.tar.gz
    format: gz
    exclusion_patterns:
      # "*/.terraform/*" alone only matches a NESTED .terraform/ (one path
      # segment before it); since `path` above IS the terraform root being
      # archived, its own top-level .terraform/ has no leading segment and
      # was silently NOT excluded. Confirmed live: a local `terraform init`
      # run from this workstation left .terraform/terraform.tfstate (the
      # backend-selection cache) in the tar, which then made the monitoring
      # host's own `terraform init -backend-config=...` fail with "Backend
      # configuration changed" against a cache it never created.
      - ".terraform/*"
      - "*/.terraform/*"
      - "*.terraform.lock.hcl"
      - "*.tfstate"
      - "*.tfstate.backup"
  delegate_to: localhost
  become: no

- name: Copy Terraform targets archive to monitoring server
  copy:
    src: /tmp/tf_targets_sync.tar.gz
    dest: /tmp/tf_targets_sync.tar.gz
    mode: "0644"

- name: Extract Terraform targets archive
  unarchive:
    src: /tmp/tf_targets_sync.tar.gz
    dest: "{{ orchestrator_base_dir }}/terraform/targets/"
    remote_src: yes

# terraform/targets' `terraform init -backend-config=../bootstrap/
# outputs.backend.tfvars` (below, matching step 3's
# documented command exactly) resolves that path relative to
# {{ orchestrator_base_dir }}/terraform/targets/, i.e.
# {{ orchestrator_base_dir }}/terraform/bootstrap/outputs.backend.tfvars —
# bootstrap/ as a sibling of targets/ under terraform/, same as modules/ and
# targets/ are synced above. That file is a Terraform-generated artifact
# (local_file.backend_tfvars in terraform/bootstrap/main.tf, written by
# `terraform apply` in that workspace) — it was never synced by any task
# here at all (confirmed live: "The file ... could not be read"), and the
# init command itself originally used `../../bootstrap/...` (one `..` too
# many, resolving outside terraform/ entirely) before this fix. Requires
# terraform/bootstrap to have already been applied on the control node
# running this playbook.
- name: Create Terraform bootstrap directory on monitoring server
  file:
    path: "{{ orchestrator_base_dir }}/terraform/bootstrap"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Sync Terraform bootstrap backend config
  copy:
    src: "{{ playbook_dir }}/../../terraform/bootstrap/outputs.backend.tfvars"
    dest: "{{ orchestrator_base_dir }}/terraform/bootstrap/outputs.backend.tfvars"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

# terraform/targets/variables.tf declares bootstrap_state_bucket and
# ubuntu_ami_id as required, with no default -- execute.py's own terraform
# invocation never supplies them (-var=project / -var=environment only), so
# without this file every drift-validation/remediation plan for
# instance_failure fails non-interactively with "Enter a value:" for a
# required variable. Confirmed live 2026-10-01: this file had only ever
# existed as a manually-created, never-version-controlled artifact on the
# pre-2026-09-28 host, and was silently lost when that instance was replaced.
- name: Deploy terraform.tfvars for targets workspace
  template:
    src: terraform-targets.tfvars.j2
    dest: "{{ orchestrator_base_dir }}/terraform/targets/terraform.tfvars"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Set ownership of Terraform files
  file:
    path: "{{ orchestrator_base_dir }}/terraform"
    state: directory
    owner: ubuntu
    group: ubuntu
    recurse: yes

# ── terraform init (pre-warm provider cache) ──────────────────────────────────
- name: Run terraform init on targets workspace
  command: >
    terraform init
    -input=false
    -backend-config=../bootstrap/outputs.backend.tfvars
  args:
    chdir: "{{ orchestrator_base_dir }}/terraform/targets"
  become_user: ubuntu
  register: tf_init
  changed_when: "'Terraform has been successfully initialized' in tf_init.stdout"

- name: Show terraform init result
  debug:
    msg: "{{ tf_init.stdout_lines[-3:] }}"
  when: tf_init.changed

# ── Sync Ansible playbooks + inventory ───────────────────────────────────────
- name: Create Ansible directory tree on monitoring server
  file:
    path: "{{ orchestrator_base_dir }}/ansible/{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - playbooks
    - inventory
    - inventory/group_vars/monitoring_host
    - inventory/group_vars/target_nodes

# This allowlist is a deliberate scope boundary (closed
# vocabulary) — the orchestrator's execute.py must only ever be able to
# invoke these 5 Ansible-actuated remediation playbooks, nothing else in
# ansible/playbooks/. A blanket directory copy would defeat that boundary,
# so this uses a per-file loop instead of `copy`'s directory-recursive mode
# (which has no include/exclude filtering, unlike the `synchronize`/rsync
# task this replaces — see note above on why synchronize doesn't work here).
- name: Sync Ansible remediation playbooks (allowlisted set only)
  copy:
    src: "{{ playbook_dir }}/../../ansible/playbooks/{{ item }}"
    dest: "{{ orchestrator_base_dir }}/ansible/playbooks/{{ item }}"
    mode: preserve
  loop:
    - kill_runaway_process.yml
    - memory_cleanup.yml
    - disk_cleanup.yml
    - service_crash.yml
    - config_reapply.yml
    - diagnostic_agents.yml

# diagnostic_agents.yml (above) invokes these two roles by name — Ansible
# resolves `roles:` entries relative to <ansible-dir>/roles/, so they must
# exist under the deployed ansible/ tree too, not just in the repo.
- name: Sync Ansible roles used by diagnostic_agents.yml (apt_lock_guard, filebeat, otel_collector)
  copy:
    src: "{{ playbook_dir }}/../../ansible/roles/{{ item }}/"
    dest: "{{ orchestrator_base_dir }}/ansible/roles/{{ item }}/"
    mode: preserve
  loop:
    - apt_lock_guard
    - filebeat
    - otel_collector

- name: Sync Ansible dynamic inventory
  copy:
    src: "{{ playbook_dir }}/../../ansible/inventory/"
    dest: "{{ orchestrator_base_dir }}/ansible/inventory/"
    mode: preserve

- name: Sync ansible.cfg
  copy:
    src: "{{ playbook_dir }}/../../ansible/ansible.cfg"
    dest: "{{ orchestrator_base_dir }}/ansible/ansible.cfg"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Set ownership of Ansible files
  file:
    path: "{{ orchestrator_base_dir }}/ansible"
    state: directory
    owner: ubuntu
    group: ubuntu
    recurse: yes

# ── Python virtual environment ─────────────────────────────────────────────────
- name: Create Python virtual environment
  command: python3 -m venv {{ orchestrator_venv }}
  args:
    creates: "{{ orchestrator_venv }}/bin/python"
  become_user: ubuntu

- name: Install orchestrator Python dependencies
  pip:
    requirements: "{{ orchestrator_src }}/requirements.txt"
    virtualenv: "{{ orchestrator_venv }}"
    virtualenv_python: python3
  become_user: ubuntu

# opentelemetry-instrumentation==0.45b0 (pinned, transitive) still imports
# pkg_resources directly instead of importlib.metadata. pkg_resources ships
# in setuptools, which modern `venv` no longer bundles automatically —
# confirmed live: "ModuleNotFoundError: No module named 'pkg_resources'" on
# worker boot, right after fixing the protobuf issue above. `state: latest`
# is not safe here: confirmed live it resolved to setuptools 83.0.0, which
# has completed setuptools' long-planned removal of pkg_resources entirely,
# reproducing the identical crash. Pin below that removal instead of always
# tracking latest.
- name: Install setuptools (provides pkg_resources)
  pip:
    name: "setuptools<75"
    virtualenv: "{{ orchestrator_venv }}"
  become_user: ubuntu

# protobuf==4.25.9 (transitive, via opentelemetry-exporter-otlp-proto-grpc==
# 1.24.0's dependency graph — not itself a pinned
# version) predates Python 3.14 wheel support: its compiled _upb C-extension
# crashes on import with "TypeError: Metaclasses with custom tp_new are not
# supported" (a CPython 3.13+ C-API change). Setting
# PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python in orchestrator.env did not
# help — confirmed live that this protobuf release's own implementation-
# selection probe crashes before it would honour that env var. Upgrade
# protobuf specifically (not the full requirements.txt pin set) to a release
# with real Python 3.14 wheels.
- name: Upgrade protobuf for Python 3.14 compatibility
  pip:
    name: protobuf
    state: latest
    virtualenv: "{{ orchestrator_venv }}"
  become_user: ubuntu

# ── systemd service ───────────────────────────────────────────────────────────
- name: Deploy orchestrator environment file
  template:
    src: orchestrator.env.j2
    dest: /etc/orchestrator/orchestrator.env
    owner: ubuntu
    group: ubuntu
    mode: "0640"
  notify: restart orchestrator

- name: Deploy orchestrator systemd service
  template:
    src: orchestrator.service.j2
    dest: /etc/systemd/system/orchestrator.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart orchestrator

- name: Enable and start orchestrator service
  systemd:
    name: orchestrator
    enabled: yes
    state: started
    daemon_reload: yes

# ── Health check ──────────────────────────────────────────────────────────────
- name: Wait for orchestrator /healthz endpoint
  uri:
    url: "http://localhost:{{ orchestrator_port }}/healthz"
    status_code: 200
  retries: 12
  delay: 5
  register: result
  until: result.status == 200
