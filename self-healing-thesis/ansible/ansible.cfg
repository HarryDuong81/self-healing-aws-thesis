# =============================================================================
# ansible/ansible.cfg
# Self-Healing Infrastructure — Master's Thesis
#
# Connection model:
#   monitoring_host group — community.aws.aws_ssm (no inbound SSH on the
#                           monitoring server's own management path)
#   target_nodes    group — ssh, set in inventory/group_vars/target_nodes/vars.yml,
#                           which wins at group_vars precedence over anything here
#
# Transport path for target remediation:
#   Flask orchestrator (monitoring server, and therefore the Ansible control node)
#     -> ansible-playbook subprocess
#       -> SSH to the target's sshd on TCP 22
#          - sg-targets permits 22 from sg-orchestrator only, never from a
#            researcher CIDR or 0.0.0.0/0
#          - authentication uses a Terraform-generated key pair whose private
#            half is provisioned only to the monitoring server
#
# The aws_ssm connection plugin was removed from this path after a reproducible
# session-completion defect under automated multi-step execution.  SSM is still
# used, but not as a remediation transport: fault injection (SendCommand), the
# Plan layer's control-plane readiness gate (PingStatus), Session Manager access,
# and bootstrap diagnostics.
#
# Remediation MTTR timing note:
#   gather_facts is disabled per-play in all remediation playbooks to avoid
#   adding setup-module latency to T_remediate.  Where host facts are needed
#   (e.g., ansible_processor_nproc), they are obtained via shell commands
#   inline.
# =============================================================================

[defaults]
# ── Inventory & connectivity defaults ────────────────────────────────────────
inventory           = inventory/aws_ec2.yml
remote_user         = ubuntu

# Ansible's default role search path includes <playbook_dir>/roles, which
# only covers playbooks living directly in ansible/. Playbooks under
# ansible/playbooks/ (e.g. deploy.yml) would otherwise look for roles in
# ansible/playbooks/roles/ and fail with "role 'common' was not found"
# (confirmed live). roles/ lives at the ansible/ root regardless of which
# subdirectory the playbook is run from.
roles_path          = roles

# Private key for SSH to the monitoring server only.
# Target instances have no key pair; this setting is irrelevant for SSM targets.
private_key_file    = ~/.ssh/self-healing-key.pem

# Concurrency: 3 targets maximum in this thesis.  forks=10 ensures all three
# targets are addressed in one batch with capacity to spare for the monitoring
# server tasks.
forks               = 10

# Connection timeout (seconds).  SSM RunCommand can take 5–10 s to bootstrap
# the session channel; 60 s gives headroom without masking real failures.
timeout             = 60

# Minimal facts — remediation playbooks set gather_facts: no individually.
# When facts are gathered (e.g., deploy.yml), collect only the minimum subset.
gather_subset       = min

# ── Fact caching (deploy plays only — not remediation) ────────────────────────
# Cache target facts for 10 minutes to avoid repeated SSM setup-module calls
# during multi-play deploys.  Not used during fault injection experiments.
fact_caching            = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout    = 600

# ── Output & logging ──────────────────────────────────────────────────────────
# result_format=yaml on the built-in `default` callback produces the same
# human-readable console output the community.general.yaml callback used to
# provide. community.general removed that plugin in v12.0.0 (superseded by
# this ansible-core option since 2.13) — confirmed live: installing
# community.general 13.1.0 to satisfy stdout_callback=yaml produced
# "community.general.yaml has been removed" instead of fixing anything.
# profile_tasks reports per-task wall-clock time — critical for MTTR analysis
# and decomposing T_classify, T_remediate, T_validate within the play.
stdout_callback         = default
callbacks_enabled       = profile_tasks
display_skipped_hosts   = false

[callback_default]
result_format           = yaml

# Persistent log for post-campaign grep.  Correlate by run_id written into
# each play's syslog logger task.
log_path                = /var/log/ansible/self-healing.log

# Disable retry file generation.  Retry files are unhelpful in automated
# orchestrator runs and clutter the working directory.
retry_files_enabled     = false

# Do NOT abort the entire play if one host fails.  During multi-target
# remediation campaigns, a failure on target-1 must not suppress remediation
# on target-2 or target-3.
any_errors_fatal        = false
max_fail_percentage     = 100

# ── SSH hardening (monitoring server only) ───────────────────────────────────
# These settings apply only to SSH connections ([monitoring] group).
# They have no effect on SSM connections to the [targets] group.
host_key_checking   = false

# ── Privilege escalation (applied globally) ───────────────────────────────────
# Both SSH (monitoring) and SSM (targets) sessions use sudo to reach root.
# Individual tasks that must not run as root can override with become: no.
[privilege_escalation]
become          = true
become_method   = sudo
become_user     = root
become_ask_pass = false

# Ansible's default become_flags include -S (read password from stdin even
# when non-interactive). Over the community.aws.aws_ssm connection plugin's
# pseudo-channel, sudo's attempted stdin read for -S never observes EOF the
# way it would over a real SSH PTY, so it blocks indefinitely — confirmed
# live: `sudo -H -S -n -u root ...` hangs forever after the BECOME-SUCCESS
# EXEC line, while `sudo -H -n -u root ...` (no -S) returns in <0.1s. -n
# alone is sufficient to keep escalation non-interactive; -S is not needed
# and is the specific flag that deadlocks over this transport.
become_flags    = -H -n

# ── SSH connection tuning (monitoring server) ─────────────────────────────────
# ControlMaster multiplexing reduces per-task connection setup for the
# monitoring server (SSH).  pipelining=true speeds up module execution.
# Both settings are IRRELEVANT for community.aws.aws_ssm connections to
# target_nodes uses these SSH settings; monitoring_host goes over aws_ssm,
# which manages its own session.
[ssh_connection]
pipelining       = true
ssh_args         = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=10
control_path_dir = /tmp/ansible-ssh

# ── AWS SSM connection plugin configuration ───────────────────────────────────
# Global defaults for the community.aws.aws_ssm plugin, which now serves the
# monitoring_host group only — target remediation goes over SSH (see header).
# Per-host values (instance ID, S3 bucket) come from the aws_ec2 dynamic
# inventory and inventory/group_vars/, not from a static hosts.ini.
#
# ssm_timeout:
#   Maximum seconds to wait for a single SSM RunCommand invocation to complete.
#   Must be > the longest expected remediation action (disk_cleanup can run
#   several minutes on a large volume).  The Gunicorn worker timeout is now
#   960 s; this value bounds an SSM session, not a remediation dispatch.
#
# bucket_sse_params:
#   SSM stores command output in S3; enforce AES-256 server-side encryption to
#   match the bucket's default encryption policy.
[community.aws.aws_ssm]
ssm_timeout         = 660
bucket_sse_params   = {"ServerSideEncryption": "AES256"}
