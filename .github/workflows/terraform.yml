name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform root configuration to operate on
        required: true
        type: choice
        options: [bootstrap, targets, baseline]
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Type DESTROY to allow a destructive operation
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_DEFAULT_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} / ${{ inputs.workspace }}
    runs-on: ubuntu-24.04
    environment: production
    # The git root is ITS2024_Master_Thesis; the artefact lives one level down.
    # Applies to every `run:` step, so the terraform -chdir paths below stay
    # repository-relative. `uses:` steps are unaffected.
    defaults:
      run:
        shell: bash
        working-directory: self-healing-thesis

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify destroy confirmation
        if: inputs.action == 'destroy'
        run: |
          if [[ "${{ inputs.confirm_destroy }}" != "DESTROY" ]]; then
            echo "Destroy not confirmed. Enter DESTROY exactly."
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: github-${{ github.run_id }}-terraform

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform 1.14.9
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Write bootstrap variables
        if: inputs.workspace == 'bootstrap'
        run: |
          cat > terraform/bootstrap/terraform.tfvars <<EOF
          project     = "self-healing-thesis"
          environment = "experiment"
          aws_region  = "ap-southeast-1"
          availability_zone   = "ap-southeast-1a"
          vpc_cidr            = "10.0.0.0/16"
          public_subnet_cidr  = "10.0.1.0/24"
          private_subnet_cidr = "10.0.2.0/24"
          researcher_cidr     = "${{ secrets.RESEARCHER_CIDR }}"
          state_bucket_name   = "${{ secrets.TF_STATE_BUCKET }}"
          data_bucket_name    = "${{ secrets.DATA_BUCKET }}"
          sns_email           = "${{ secrets.SNS_EMAIL }}"
          noncurrent_version_expiry_days = 90
          key_pair_name = ""
          EOF

      # Bootstrap is the only root with a chicken-and-egg backend: the S3
      # bucket and lock table that hold its state are created by bootstrap
      # itself. The first apply therefore runs against a temporary local
      # backend, after which the state is migrated to S3.
      - name: Detect bootstrap remote state
        if: inputs.workspace == 'bootstrap'
        id: bootstrap_state
        run: |
          if aws s3api head-object \
              --bucket "${{ secrets.TF_STATE_BUCKET }}" \
              --key bootstrap/terraform.tfstate >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject bootstrap plan/destroy before first state migration
        if: inputs.workspace == 'bootstrap' && inputs.action != 'apply' && steps.bootstrap_state.outputs.exists == 'false'
        run: |
          echo "Bootstrap has no remote state yet. Run bootstrap/apply once to create and migrate it."
          exit 1

      - name: Validate targets AMI input
        if: inputs.workspace == 'targets'
        run: |
          if [[ -z "${{ secrets.UBUNTU_AMI_ID }}" ]]; then
            echo "UBUNTU_AMI_ID secret is empty. Set it to the AMI pinned in terraform/bootstrap/main.tf."
            exit 1
          fi

      # ── Campaign guard ────────────────────────────────────────────────────
      # Runs for every operation except a cold-start bootstrap apply, where the
      # monitoring host does not exist yet. The instance is resolved directly
      # from EC2 tags rather than from Terraform outputs, because for a
      # `targets` run the bootstrap root is never initialised in this workspace
      # and `terraform output` would fail silently, skipping the guard.
      # An unresolvable instance is a failure, never a skip.
      - name: Campaign guard
        if: ${{ !(inputs.workspace == 'bootstrap' && inputs.action == 'apply' && steps.bootstrap_state.outputs.exists == 'false') }}
        run: |
          set -euo pipefail

          monitoring_id="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=self-healing-thesis" \
                      "Name=tag:Role,Values=monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)"

          if [[ -z "$monitoring_id" || "$monitoring_id" == "None" ]]; then
            echo "Campaign guard could not resolve a running monitoring instance."
            echo "Refusing to proceed: an unverifiable campaign state is treated as unsafe."
            exit 1
          fi
          echo "Monitoring instance: $monitoring_id"

          command_id="$(aws ssm send-command \
            --instance-ids "$monitoring_id" \
            --document-name AWS-RunShellScript \
            --comment "campaign guard ${GITHUB_RUN_ID}" \
            --parameters 'commands=["pgrep -f '\''run_campaign.py|run_one.py|run_manual_trial.py|run_s3_trial.py'\'' >/dev/null && exit 42 || exit 0"]' \
            --query 'Command.CommandId' --output text)"

          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$monitoring_id" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "Campaign guard passed: no trial harness running."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Campaign process is active, or the guard could not run: $status"
                exit 1
                ;;
              *) sleep 3 ;;
            esac
          done
          echo "Campaign guard timed out."
          exit 1

      # ── Phase 1 + 2: cold-start local apply, then migrate state to S3 ──────
      - name: Bootstrap cold-start — local backend apply and state migration
        if: inputs.workspace == 'bootstrap' && inputs.action == 'apply' && steps.bootstrap_state.outputs.exists == 'false'
        run: |
          set -euo pipefail

          # A backend block in an override file replaces the original entirely,
          # so this switches bootstrap to a local backend without editing the
          # tracked backend.tf.
          cat > terraform/bootstrap/backend_override.tf <<'EOF2'
          terraform {
            backend "local" {}
          }
          EOF2

          trap 'rm -f terraform/bootstrap/backend_override.tf' EXIT
          terraform -chdir=terraform/bootstrap init -reconfigure -input=false
          terraform -chdir=terraform/bootstrap validate
          terraform -chdir=terraform/bootstrap apply -auto-approve -input=false
          rm -f terraform/bootstrap/backend_override.tf
          trap - EXIT

          terraform -chdir=terraform/bootstrap init \
            -migrate-state -force-copy -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=ap-southeast-1"

          terraform -chdir=terraform/bootstrap output
          echo "Cold start complete: bootstrap applied and state migrated to S3."

      - name: Initialize bootstrap remote state
        if: inputs.workspace == 'bootstrap' && steps.bootstrap_state.outputs.exists == 'true'
        run: |
          terraform -chdir=terraform/bootstrap init \
            -reconfigure -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=ap-southeast-1"

      - name: Write targets variables
        if: inputs.workspace == 'targets'
        run: |
          cat > terraform/targets/terraform.tfvars <<EOF
          project                = "self-healing-thesis"
          environment            = "experiment"
          aws_region             = "ap-southeast-1"
          availability_zone      = "ap-southeast-1a"
          instance_type          = "t3.micro"
          ubuntu_ami_id          = "${{ secrets.UBUNTU_AMI_ID }}"
          bootstrap_state_bucket = "${{ secrets.TF_STATE_BUCKET }}"
          bootstrap_state_key    = "bootstrap/terraform.tfstate"
          key_pair_name          = ""
          EOF

      # ── Phase 3: targets, consuming the now-durable bootstrap state ────────
      - name: Initialize targets remote state
        if: inputs.workspace == 'targets'
        run: |
          if ! aws s3api head-object \
              --bucket "${{ secrets.TF_STATE_BUCKET }}" \
              --key bootstrap/terraform.tfstate >/dev/null 2>&1; then
            echo "Bootstrap remote state does not exist. Run bootstrap/apply first."
            exit 1
          fi
          terraform -chdir=terraform/targets init \
            -reconfigure -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=ap-southeast-1"

      # The baseline root (the S3 comparison system) needs the same two
      # preparation steps as targets. Without them, selecting workspace=baseline
      # reaches `terraform plan` with no tfvars written and no backend
      # initialised — bootstrap_state_bucket has no default, so the run fails
      # confusingly rather than cleanly.
      #
      # project and environment MUST match the targets root: together they
      # compose local.name_prefix, which composes the ASG name that
      # experiments/trials/run_s3_trial.py resolves independently through boto3.
      - name: Write baseline variables
        if: inputs.workspace == 'baseline'
        run: |
          cat > terraform/baseline/terraform.tfvars <<EOF
          project                = "self-healing-thesis"
          environment            = "experiment"
          aws_region             = "ap-southeast-1"
          instance_type          = "t3.micro"
          bootstrap_state_bucket = "${{ secrets.TF_STATE_BUCKET }}"
          bootstrap_state_key    = "bootstrap/terraform.tfstate"
          EOF

      - name: Initialize baseline remote state
        if: inputs.workspace == 'baseline'
        run: |
          if ! aws s3api head-object \
              --bucket "${{ secrets.TF_STATE_BUCKET }}" \
              --key bootstrap/terraform.tfstate >/dev/null 2>&1; then
            echo "Bootstrap remote state does not exist. Run bootstrap/apply first."
            exit 1
          fi
          terraform -chdir=terraform/baseline init \
            -reconfigure -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=ap-southeast-1"

      # `terraform fmt` is deliberately NOT run here: it formats .tfvars as well
      # as .tf, and the tfvars files written above are generated rather than
      # committed. Formatting of tracked files is enforced in ci.yml.
      - name: Terraform validate
        if: ${{ !(inputs.workspace == 'bootstrap' && inputs.action == 'apply' && steps.bootstrap_state.outputs.exists == 'false') }}
        run: terraform -chdir=terraform/${{ inputs.workspace }} validate

      - name: Terraform plan
        if: ${{ inputs.action != 'destroy' && !(inputs.workspace == 'bootstrap' && inputs.action == 'apply' && steps.bootstrap_state.outputs.exists == 'false') }}
        run: terraform -chdir=terraform/${{ inputs.workspace }} plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' && !(inputs.workspace == 'bootstrap' && steps.bootstrap_state.outputs.exists == 'false') }}
        run: terraform -chdir=terraform/${{ inputs.workspace }} apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform -chdir=terraform/${{ inputs.workspace }} destroy -input=false -auto-approve

      - name: Show outputs
        if: ${{ inputs.action != 'destroy' && !(inputs.workspace == 'bootstrap' && inputs.action == 'apply' && steps.bootstrap_state.outputs.exists == 'false') }}
        run: terraform -chdir=terraform/${{ inputs.workspace }} output
